name: 'Rebel Media PromCI'
description: 'Build and Publish Prometheus exporters with GitHub Actions.'
author: 'Rebel Media'
runs:
  using: composite
  steps:
    # The runner has already downloaded this action at exactly the ref the
    # caller pinned (a tag or, preferably, a commit SHA). Copying that copy into
    # the workspace, instead of checking out a second one at a hard-coded tag,
    # means the nested actions a workflow then runs are the same commit it
    # pinned — so pinning promci by SHA really pins everything it runs.
    - name: Copy the PromCI actions into the workspace
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        rm -rf .github/promci
        mkdir -p .github/promci
        cp -R "${ACTION_PATH}/." .github/promci/
branding:
  icon: terminal
  color: black
