---
name: Publish release image
inputs:
  registry:
    type: string
    description: Container Registry
  organization:
    type: string
    description: Organization
  login:
    type: string
    description: Username
  password:
    type: string
    description: Password
  container_image_name:
    description: Name of the container image
    type: string
  container_image_tag:
    description: Container image tag
    type: string
    default: ${{ github.ref_name }}
  container_image_arch:
    description: Container image architecture
    type: string
    default: "linux/amd64"
runs:
  using: composite
  steps:

    - name: Login to ${{ inputs.registry }} Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.login }}
        password: ${{ inputs.password }}

    - name: Compute image tags
      id: image_tags
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        ORGANIZATION: ${{ inputs.organization }}
        IMAGE_NAME: ${{ inputs.container_image_name }}
        IMAGE_TAG: ${{ inputs.container_image_tag }}
      run: |
        set -euo pipefail
        image="${REGISTRY}/${ORGANIZATION}/${IMAGE_NAME}"
        tag="${IMAGE_TAG}"

        tags=("${image}:${tag}")
        case "${tag}" in
          *-*) ;;
          *) tags+=("${image}:latest") ;;
        esac

        {
          echo "tags<<EOF"
          printf '%s\n' "${tags[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and Push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        no-cache: true
        platforms: ${{ inputs.container_image_arch }}
        push: true
        sbom: true
        tags: ${{ steps.image_tags.outputs.tags }}
