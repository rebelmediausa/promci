---
name: Build
inputs:
  thread:
    type: integer
    description: Current thread
    required: true
    default: 3
  parallelism:
    type: integer
    description: Number of builds to do in parallel
    default: 3
  promu_config:
    type: string
    description: Config file for promu
    default: .promu.yml
  promu_cgo_config:
    type: string
    description: Config file for promu-cgo
    default: .promu-cgo.yml
  promu_opts:
    type: string
    description: Options to pass to promu
  promu_codesign_binary:
    type: string
    description: Binary file to codesign
runs:
  using: composite
  steps:

    - name: Setup Environment
      uses: ./.github/promci/actions/setup_environment
      with:
        enable_docker_multibuild: true

    - name: Promu Build
      shell: bash
      # Inputs reach the script through env and are quoted, never pasted in
      # with ${{ }}, so a value can neither split into extra arguments nor run
      # as a command.
      # PROMU_OPTS may hold several options, so it is split into an array on
      # whitespace; no word is ever evaluated.
      run: |
        set -euo pipefail
        if [[ -f "$PROMU_CONFIG" ]]; then
          read -ra opts <<< "$PROMU_OPTS"
          ~/go/bin/promu --config "$PROMU_CONFIG" crossbuild -v --parallelism "$PARALLELISM" --parallelism-thread "$THREAD" "${opts[@]}"
        fi
      env:
        PROMU_CONFIG: ${{ inputs.promu_config }}
        PROMU_OPTS: ${{ inputs.promu_opts }}
        PARALLELISM: ${{ inputs.parallelism }}
        THREAD: ${{ inputs.thread }}
        Version: ${{ env.VERSION }}
        Revision: ${{ env.REVISION }}
        Branch: ${{ env.BRANCH }}
        Tags: ${{ env.TAGS }}


    - name: Promu cgo Build
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f "$PROMU_CGO_CONFIG" ]]; then
          read -ra opts <<< "$PROMU_OPTS"
          ~/go/bin/promu --config "$PROMU_CGO_CONFIG" crossbuild -v --parallelism "$PARALLELISM" --parallelism-thread "$THREAD" "${opts[@]}"
        fi
      env:
        PROMU_CGO_CONFIG: ${{ inputs.promu_cgo_config }}
        PROMU_OPTS: ${{ inputs.promu_opts }}
        PARALLELISM: ${{ inputs.parallelism }}
        THREAD: ${{ inputs.thread }}
        Version: ${{ env.VERSION }}
        Revision: ${{ env.REVISION }}
        Branch: ${{ env.BRANCH }}
        Tags: ${{ env.TAGS }}

    - name: Codesign
      shell: bash
      run: |
        set -euo pipefail
        for arch in darwin-arm64 darwin-amd64; do
          if [[ -d "$PWD/.build/$arch" ]]; then
            ~/go/bin/promu codesign "$PWD/.build/$arch/$CODESIGN_BINARY"
          fi
        done
      env:
        CODESIGN_BINARY: ${{ inputs.promu_codesign_binary }}

    - name: Save Artifacts
      uses: ./.github/promci/actions/save_artifacts
      with:
        directory: .build
