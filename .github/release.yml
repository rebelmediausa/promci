# Groups the generated list of merged pull requests that GitHub appends below
# the handwritten notes from CHANGELOG.md.
changelog:
  exclude:
    labels: [changelog-ignore, duplicate, invalid, question]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
