---
name: Feature Request
description: Suggest an idea for this action.
title: "[FEATURE REQUEST]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The input, output or behaviour you would like.
    validations:
      required: true
