---
name: Stale Check

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  issues:
    name: Stale issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 120
          days-before-close: 21
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: security,confirmed,roadmap,enhancement
          stale-issue-label: stale
          stale-issue-message: >-
            This issue has had no activity for 120 days and will be closed in
            21 days unless someone comments to confirm it still applies to the
            latest release.
          close-issue-message: This issue was closed due to inactivity.
